name: CI — Python and HMI JavaScript

on:
  push:
  pull_request:
  workflow_dispatch:

# The workflow uses no repo secrets and cannot write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check frontend and test JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in gui/js/*.js tests/*.cjs; do
            node --check "$file"
          done
          node tests/io_mapping_runtime.cjs

      - name: Run HMI review/automatic state regressions
        run: node tests/hmi_review_checkbox_runtime.cjs

      - name: Run PLC preflight diagnosis regressions
        run: node tests/source_import_diagnostics.cjs

  python:
    name: Python pytest (isolated PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tia_engineering_assistant
          POSTGRES_USER: tia_user
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tia_user -d tia_engineering_assistant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: tia_engineering_assistant
      DB_USER: tia_user
      DB_PASSWORD: ci_ephemeral_only
      DB_HOST: 127.0.0.1
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      # Several Python regression tests execute Node-based JavaScript harnesses.
      - name: Set up Node.js for pytest harnesses
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run full Python test suite
        run: python -m pytest -q

  browser_gui:
    name: GUI editor (Playwright Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_URL: http://127.0.0.1:8765/
      PLAYWRIGHT_ARTIFACTS_DIR: test-results/playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install backend and Playwright
        run: |
          python -m pip install -r requirements.txt
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start isolated FastAPI for browser test
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn engine.main:app --host 127.0.0.1 --port 8765 \
            > "${RUNNER_TEMP}/tia-browser-backend.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/health > /dev/null; then
              echo "Isolated FastAPI is ready"
              exit 0
            fi
            sleep 1
          done
          echo "FastAPI did not become ready"
          cat "${RUNNER_TEMP}/tia-browser-backend.log"
          exit 1

      - name: Smoke-test Playwright failure artifacts
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PLAYWRIGHT_DIAGNOSTICS_SMOKE=1 \
          PLAYWRIGHT_ARTIFACTS_DIR=test-results/playwright-smoke \
            node tests/member_editor_browser.cjs \
              > "${RUNNER_TEMP}/playwright-diagnostics-smoke.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Expected the intentional smoke failure to exit nonzero"
            exit 1
          fi
          for name in failure.png trace.zip console-errors.log failure.txt; do
            test -s "test-results/playwright-smoke/$name" || {
              echo "Missing Playwright artifact: $name"
              cat "${RUNNER_TEMP}/playwright-diagnostics-smoke.log"
              exit 1
            }
          done
          grep -q "Intentional Playwright diagnostics smoke error" \
            test-results/playwright-smoke/console-errors.log
          grep -q "Intentional Playwright diagnostics smoke failure" \
            test-results/playwright-smoke/failure.txt
          echo "Playwright failure evidence smoke: PASS"
          rm -r test-results/playwright-smoke

      - name: Run existing UDT/DB browser regression
        run: node tests/member_editor_browser.cjs

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gui-browser-failure-diagnostics
          path: |
            test-results/playwright/
            test-results/playwright-smoke/
            ${{ runner.temp }}/tia-browser-backend.log
            ${{ runner.temp }}/playwright-diagnostics-smoke.log
          if-no-files-found: warn
          retention-days: 7
